    <!-- 커스텀 css, js -->
    <link rel="stylesheet" href="/admin-orders/admin-orders.css" />
    <script src="/admin-orders/admin-orders.js" type="module" defer></script>
    <script src="/category/nav.js" defer></script>
  </head>
  <body>
    <!-- 헤더 -->
    <div class="container mt-3">
      <div id="navContainer"></div>
    </div>

    <!-- 주문관리 -->
    <section class="section">
      <div class="container">
        <!-- 검색창 추가 -->

        <!-- 제목 -->
        <div class="block account-header">
          <h1 class="subtitle is-4">주문관리</h1>
        </div>

        <!-- Css 활용해서 오른쪽에 위치시키기 -->
        <form class="sortForm" action="#">
          <select name="languages" id="sort">
            <option value="사용자 ID" class="user">사용자 ID</option>
            <option value="날짜" class="date">날짜</option>
            <option value="주문총액" class="order">주문총액</option>
          </select>
        </form>


        <div class="container orders-container" id="ordersContainer">
          <div
            class="columns notification is-info is-light is-mobile orders-top"
          >
            <div class="column is-2">주문날짜</div>
            <div class="column is-2">주문한 사용자 ID</div>
            <div class="column is-4">주문정보</div>
            <div class="column is-2">주문총액</div>
          </div>

          <div
                  class="columns notification is-info is-light is-mobile orders-top"
          >
            <div class="column is-2 order-date" >2025-01-02</div>
            <div class="column is-2 userId">user123</div>
            <div class="column is-4 order-product" id="order-product">
              <span > 캐주얼 스니커즈 / 3개 </span>
              <button class="toggle-button">↓</button>
              <span class="product-details" style="display: none;">퍼피렛 오프 화이트 패딩 신발 / 5개</span>
            </div>
            <div class="column is-2 order-total">$120</div>
          </div>
        </div>
