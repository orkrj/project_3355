<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping Mall</title>
  <!-- 아이콘 -->
  <link
          rel="icon"
          type="image/png"
          sizes="16x16"
          href="/elice-rabbit-favicon.png"
  />
  <!-- bulma css -->
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css"
  />
  <!-- 폰트 어썸: 아이콘 -->
  <script
          defer
          src="https://kit.fontawesome.com/9daa42bcef.js"
          crossorigin="anonymous"
  ></script>
  <!-- 커스텀 css, js -->
  <link rel="stylesheet" href="/account-orders/account-orders.css" />
  <script src="/account-orders/account-orders.js" type="module" defer></script>
  <script src="/cart/cart.js" type="module" defer></script>
  <script src="/category/nav.js" defer></script>
</head>
<body>
<!-- 헤더 -->
<div class="container mt-3">
  <div id="navContainer"></div>
</div>

<!-- 주문조회 -->
<section class="section">
  <div class="container">


    <div class="block account-header">
      <h1 class="subtitle is-4">내 주문조회</h1>
    </div>
    <div class="container orders-container" id="ordersContainer">
      <div
              class="columns notification is-info is-light is-mobile orders-top"
      >
        <div class="column is-2">날짜</div>
        <div class="column is-6">주문정보</div>
        <div class="column is-2">상태</div>
        <div class="column is-2">주문총합</div>
      </div>
      <div class="columns notification is-info is-light is-mobile orders-top">
        <div class="column is-2">2024-12-31</div>
        <div class="column is-6" id="order-product">
          <span > 캐주얼 스니커즈 / 3개 </span>
          <button class="toggle-button">↓</button>
          <span class="product-details" style="display: none;">퍼피렛 오프 화이트 패딩 신발 / 5개</span>
        </div>
        <div class="column is-2">주문완료</div>
        <div class="column is-2">791,369원</div>
        <button class="delete">삭제하기</button>
      </div>
    </div>
  </div>
</section>




</body>
</html>
